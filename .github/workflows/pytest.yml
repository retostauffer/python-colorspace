name: Testing

on:
  push:
    branch:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12",
                         "3.13", "3.14"]
        # https://devguide.python.org/versions/
        # Python 3.7 reached EOL mid 2023
        # Python 3.8  reached EOL mid 2024
        # Python 3.9  reached EOL mid 2025
        # Python 3.10 will reach EOL end of 2026
        # Python 3.11 will reach EOL end of 2027
        # Python 3.12 will reach EOL end of 2028
        #
        # Added after initial 1.0 release:
        # Python 3.13, planned lifetime end of 2024 - end of 2029
        # Python 3.14, planned lifetime end of 2025 - end of 2030
        # Python 3.15 may become available end of 2026

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installing colorspace
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_devel.txt
          pip install -e .

      - name: Running Soft Tests (without development packages)
        run: |
          pytest -s

      - name: Install Development Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_devel.txt
          pip install -e .

      - name: Running Full Tests (with development packages)
        run: |
          pytest -s

